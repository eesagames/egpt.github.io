<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-GPT</title>
<style>
html,body{margin:0;height:100%;background:#0a0613;color:#e7dcf7;font-family:'Mulish','Inter',system-ui,-apple-system,sans-serif;}
#view-ai{position:fixed;inset:0;display:flex;}
#view-ai>.rk{flex:1;}
#eg-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#000;color:#fff;padding:10px 16px;border-radius:999px;font:600 .82rem system-ui;opacity:0;transition:all .45s cubic-bezier(.32,.72,0,1);z-index:9999;pointer-events:none;box-shadow:inset 0 0 0 1px #ffffff1a}
#eg-toast.on{opacity:1;transform:translateX(-50%)}
</style>
<style>
/* ==================================================================
   EESA GAMES 4.0 — EUBG
   Cherri design tokens + Rocky AI suite + rebuilt chat / profile / shop
   ================================================================== */
:root{
  /* EUBG purple — the Cherri structure, our colours */
  --ch-bg:#0a0613; --ch-bg1:#110a1e; --ch-bg2:#170e28; --ch-bg3:#1e1334; --ch-bg4:#271a44;
  --ch-accent:#c77dff; --ch-accent2:#7b2fbe; --ch-glow:#c77dffbd;
  --ch-text:#e7dcf7; --ch-muted:#a294c4; --ch-bright:#f8f4ff;
  --ch-b:#d8c8ff38; --ch-b2:#d8c8ff24; --ch-b3:#d8c8ff17; --ch-b4:#d8c8ff0d;
  --ch-on:#1a0033;
  --e4:cubic-bezier(.22,1,.36,1);
  --e4s:cubic-bezier(.34,1.4,.64,1);
}

#view-ai{padding:0 !important;overflow:hidden !important;background:var(--ch-bg) !important;}
#view-ai .eai-shell{display:none !important;}
.rk{
  --rk-bg:#0a0613; --rk-bg1:#140c23; --rk-bg2:#110a1e; --rk-bg3:#1e1334; --rk-bg4:#271a44;
  --rk-tx:#e9e0f7; --rk-mu:#a294c4; --rk-mu2:#7b6d99;
  --rk-br:#d8c8ff17; --rk-br2:#d8c8ff2e;
  --rk-acc:#a855f7; --rk-acc2:#c77dff;
  position:absolute;inset:0;display:flex;background:var(--rk-bg);color:var(--rk-tx);
  font-family:'Mulish','Inter','Segoe UI',system-ui,sans-serif;overflow:hidden;
}
.rk *{box-sizing:border-box;}
.rk button{font-family:inherit;}

/* ---- no sidebar. chats live in a popover off the top-left icon ---- */
.rk-hist{position:absolute;top:50px;left:14px;z-index:60;width:272px;max-height:62vh;display:flex;flex-direction:column;
  background:var(--rk-bg1);border:1px solid var(--rk-br2);border-radius:14px;padding:7px;box-shadow:0 22px 60px #000b;
  opacity:0;transform:translateY(-8px) scale(.97);pointer-events:none;
  transition:opacity .22s var(--e4),transform .26s var(--e4);}
.rk-hist.on{opacity:1;transform:none;pointer-events:auto;}
.rk-srch{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:9px;background:var(--rk-bg2);
  border:1px solid transparent;margin-bottom:5px;flex:none;transition:border-color .25s;}
.rk-srch:focus-within{border-color:var(--rk-br2);}
.rk-srch svg{width:13px;height:13px;color:var(--rk-mu2);flex:none;}
.rk-srch input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--rk-tx);font-size:.78rem;font-weight:600;font-family:inherit;}
.rk-seclab{font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--rk-mu2);padding:7px 8px 4px;flex:none;}
.rk-list{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:1px;}
.rk-list::-webkit-scrollbar{width:6px;}
.rk-list::-webkit-scrollbar-thumb{background:var(--rk-br2);border-radius:9px;}
.rk-cv{position:relative;display:flex;align-items:center;gap:8px;padding:8px 26px 8px 9px;border-radius:8px;cursor:pointer;
  color:var(--rk-mu);font-size:.79rem;font-weight:600;white-space:nowrap;overflow:hidden;transition:background .18s,color .18s;}
.rk-cv:hover{background:var(--rk-bg3);color:#fff;}
.rk-cv.on{background:var(--rk-bg4);color:#fff;}
.rk-cv span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;}
.rk-cvx{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:18px;height:18px;border:0;border-radius:5px;
  background:transparent;color:var(--rk-mu2);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:.9rem;padding:0;}
.rk-cv:hover .rk-cvx{display:flex;}
.rk-cvx:hover{background:var(--rk-br2);color:#fff;}
.rk-hfoot{border-top:1px solid var(--rk-br);padding:8px 8px 2px;margin-top:5px;flex:none;
  font-size:.67rem;font-weight:700;color:var(--rk-mu2);display:flex;align-items:center;gap:6px;}
.rk-hfoot b{color:var(--rk-acc2);font-weight:800;}
.rk-hfoot svg{width:12px;height:12px;flex:none;color:var(--rk-acc2);}

/* ---- main ---- */
.rk-main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;}
/* floating controls — kimi keeps the chrome almost invisible */
.rk-float{position:absolute;top:12px;left:14px;z-index:30;display:flex;gap:4px;}
.rk-ic{width:30px;height:30px;border-radius:9px;border:0;background:transparent;color:var(--rk-mu);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s,transform .24s var(--e4s);}
.rk-ic:hover{background:var(--rk-bg3);color:#fff;}
.rk-ic:active{transform:scale(.9);}
.rk-ic svg{width:16px;height:16px;}
.rk-top{position:absolute;top:0;left:0;right:0;height:54px;z-index:20;display:none;align-items:center;gap:10px;
  padding:0 16px 0 94px;background:linear-gradient(var(--rk-bg) 62%,transparent);}
.rk.chatting .rk-top{display:flex;}
.rk-ttl{font-size:.84rem;font-weight:700;color:var(--rk-tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rk-topr{margin-left:auto;display:flex;align-items:center;gap:4px;}
/* the purple plan pill, kimi puts it dead centre at the top */
.rk-plan{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:25;
  display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 15px;border-radius:99px;border:0;cursor:pointer;
  background:color-mix(in srgb,var(--rk-acc) 16%,transparent);color:var(--rk-acc2);
  font-size:.78rem;font-weight:700;white-space:nowrap;
  transition:background .22s,transform .26s var(--e4s);}
.rk-plan:hover{background:color-mix(in srgb,var(--rk-acc) 26%,transparent);transform:translateX(-50%) translateY(-1px);}
.rk-plan svg{width:13px;height:13px;}
.rk.chatting .rk-plan{display:none;}

.rk-scroll{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth;display:none;}
.rk.chatting .rk-scroll{display:block;}
.rk-scroll::-webkit-scrollbar{width:8px;}
.rk-scroll::-webkit-scrollbar-thumb{background:#ffffff14;border-radius:9px;}
.rk-wrap{max-width:765px;margin:0 auto;padding:68px 20px 10px;}

/* ---- landing : wordmark + composer + subbar + pills ---- */
.rk-stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px 40px;}
.rk.chatting .rk-stage{display:none;}
.rk-word{position:relative;font-family:'Rocky Mark','Archivo',system-ui,sans-serif;
  font-size:clamp(2.3rem,5.4vw,3.55rem);font-weight:700;letter-spacing:0;line-height:1;
  transform:scaleX(1.05);transform-origin:50% 50%;
  margin-bottom:38px;animation:rkWord .66s var(--e4) both;
  background:linear-gradient(100deg,#efe9f8 0%,#efe9f8 58%,var(--rk-acc2) 104%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
.rk-word:after{content:'';position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:130%;height:190%;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--rk-acc) 13%,transparent),transparent 70%);
  z-index:-1;pointer-events:none;}
@keyframes rkUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
@keyframes rkWord{from{opacity:0;transform:scaleX(1.05) translateY(14px);}to{opacity:1;transform:scaleX(1.05) translateY(0);}}

/* composer stack — the sub-bar peeks out beneath the box, kimi style */
.rk-stack{position:relative;width:100%;max-width:765px;margin:0 auto;animation:rkUp .66s .05s var(--e4) both;}
#rk-slot-top{width:100%;max-width:765px;}
.rk-sub{position:absolute;left:20px;right:20px;top:100%;margin-top:-16px;height:62px;z-index:0;
  background:var(--rk-bg2);border:1px solid var(--rk-br);border-top:0;border-radius:0 0 15px 15px;
  display:flex;align-items:flex-end;padding:0 16px 12px;gap:18px;}
.rk-sb{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--rk-mu);cursor:pointer;
  font-size:.78rem;font-weight:600;padding:3px 2px;transition:color .2s;}
.rk-sb:hover{color:#fff;}
.rk-sb svg{width:14px;height:14px;}
.rk-sb.r{margin-left:auto;}
.rk-plugdots{display:inline-flex;gap:2px;margin-right:1px;}
.rk-plugdots i{width:11px;height:11px;border-radius:3px;display:block;}

.rk-box{position:relative;z-index:1;border-radius:16px;background:var(--rk-bg1);border:1px solid var(--rk-br);
  transition:border-color .3s var(--e4),box-shadow .35s var(--e4);}
.rk-box:focus-within{border-color:#ffffff2e;box-shadow:0 0 0 4px color-mix(in srgb,var(--rk-acc) 9%,transparent);}
.rk-ta{width:100%;background:none;border:0;outline:0;resize:none;color:var(--rk-tx);font-family:inherit;font-size:.95rem;
  line-height:1.55;padding:19px 20px 0;max-height:230px;min-height:58px;}
.rk-ta::placeholder{color:var(--rk-mu2);}
.rk-row{display:flex;align-items:center;gap:8px;padding:8px 12px 12px;}
.rk-cb{width:30px;height:30px;border-radius:9px;border:0;background:transparent;color:var(--rk-mu);cursor:pointer;
  display:flex;align-items:center;justify-content:center;position:relative;
  transition:background .2s,color .2s,transform .24s var(--e4s);}
.rk-cb:hover{background:var(--rk-bg3);color:#fff;}
.rk-cb:active{transform:scale(.9);}
.rk-cb svg{width:17px;height:17px;}
.rk-cb .dot{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--rk-acc);}
.rk-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--rk-br2);
  background:transparent;color:var(--rk-mu);font-size:.73rem;font-weight:700;cursor:pointer;white-space:nowrap;
  transition:background .22s,color .22s,border-color .22s,transform .24s var(--e4s);}
.rk-chip:hover{color:#fff;background:var(--rk-bg3);}
.rk-chip:active{transform:scale(.95);}
.rk-chip.on{background:color-mix(in srgb,var(--rk-acc) 20%,transparent);color:var(--rk-acc2);
  border-color:color-mix(in srgb,var(--rk-acc) 42%,transparent);}
.rk-chip svg{width:13px;height:13px;}
/* model picker: plain text, no pill — exactly like kimi */
.rk-mdl{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-radius:8px;
  border:0;background:transparent;color:var(--rk-tx);font-size:.8rem;font-weight:700;cursor:pointer;white-space:nowrap;
  transition:background .2s;}
.rk-mdl:hover{background:var(--rk-bg3);}
.rk-mdl em{font-style:normal;color:var(--rk-mu2);font-weight:600;}
.rk-go{width:32px;height:32px;border-radius:50%;border:0;background:var(--rk-bg4);color:var(--rk-mu);cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;transition:transform .26s var(--e4s),background .22s,color .22s;}
.rk-go.live{background:var(--rk-acc2);color:#1a0033;}
.rk-go.live:hover{transform:scale(1.08);}
.rk-go:active{transform:scale(.92);}
.rk-go svg{width:15px;height:15px;}
.rk-go.stop{background:var(--rk-acc2);color:#1a0033;}
.rk-hint{text-align:center;font-size:.68rem;font-weight:600;color:var(--rk-mu2);padding:9px 0 0;}

/* quick pills */
.rk-quick{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:86px;animation:rkUp .66s .1s var(--e4) both;}
.rk-qb{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 15px;border-radius:99px;border:1px solid var(--rk-br2);
  background:transparent;color:var(--rk-mu);font-size:.79rem;font-weight:600;cursor:pointer;
  transition:transform .26s var(--e4s),background .22s,color .22s,border-color .22s;}
.rk-qb:hover{color:#fff;border-color:color-mix(in srgb,var(--rk-acc) 55%,transparent);
  background:color-mix(in srgb,var(--rk-acc) 10%,transparent);transform:translateY(-2px);}
.rk-qb svg{width:14px;height:14px;}

/* bottom composer when chatting */
.rk-comp{flex:none;padding:0 20px 16px;display:none;}
.rk.chatting .rk-comp{display:block;}
.rk-comp .rk-stack{margin:0 auto;}
.rk-comp .rk-sub{display:none;}

/* attachments */
.rk-files{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px 0;}
.rk-file{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:8px;background:var(--rk-bg3);
  font-size:.72rem;font-weight:700;color:var(--rk-tx);max-width:220px;}
.rk-file i{font-style:normal;color:var(--rk-mu2);font-size:.6rem;text-transform:uppercase;font-weight:900;}
.rk-file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rk-file button{border:0;background:none;color:var(--rk-mu2);cursor:pointer;padding:0;font-size:.9rem;line-height:1;}
.rk-file button:hover{color:#fff;}

/* ---- popups ---- */
.rk-pop{position:absolute;z-index:70;min-width:236px;background:var(--rk-bg1);border:1px solid var(--rk-br2);border-radius:14px;
  padding:6px;box-shadow:0 20px 56px #000c;opacity:0;transform:translateY(8px) scale(.97);pointer-events:none;
  transition:opacity .22s var(--e4),transform .26s var(--e4);}
.rk-pop.on{opacity:1;transform:none;pointer-events:auto;}
.rk-po{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;
  color:var(--rk-tx);font-size:.8rem;font-weight:700;transition:background .16s;}
.rk-po:hover{background:var(--rk-bg3);}
.rk-po>svg{width:15px;height:15px;flex:none;margin-top:1px;color:var(--rk-mu);}
.rk-po .t{display:block;}
.rk-po .d{display:block;font-size:.71rem;font-weight:600;color:var(--rk-mu2);margin-top:2px;line-height:1.4;}
.rk-po .ck{margin-left:auto;color:var(--rk-acc2);flex:none;display:flex;}
.rk-po .ck svg{width:14px;height:14px;color:var(--rk-acc2);}
.rk-po .arw{margin-left:auto;color:var(--rk-mu2);display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;}
.rk-po .arw svg{width:13px;height:13px;}
.rk-po.lock{opacity:.6;cursor:default;}
.rk-psep{height:1px;background:var(--rk-br);margin:5px 4px;}
.rk-ptag{display:inline-block;font-size:.58rem;font-weight:900;letter-spacing:.4px;
  background:color-mix(in srgb,var(--rk-acc) 26%,transparent);color:var(--rk-acc2);
  padding:2px 5px;border-radius:4px;margin-left:6px;vertical-align:middle;}

/* ---- messages ---- */
.rk-m{margin-bottom:28px;animation:rkIn .5s var(--e4) both;}
@keyframes rkIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.rk-user{display:flex;justify-content:flex-end;}
.rk-ub{max-width:80%;background:var(--rk-bg4);border-radius:18px;padding:11px 16px;font-size:.93rem;
  line-height:1.6;color:#fff;white-space:pre-wrap;word-break:break-word;}
.rk-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.rk-av{width:22px;height:22px;border-radius:50%;background:linear-gradient(140deg,var(--rk-acc2),var(--rk-acc));
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.58rem;flex:none;}
.rk-who{font-size:.78rem;font-weight:800;color:var(--rk-tx);}
.rk-badge{font-size:.62rem;font-weight:700;color:var(--rk-mu2);background:var(--rk-bg2);padding:2px 7px;border-radius:5px;}
.rk-body{font-size:.94rem;line-height:1.74;color:var(--rk-tx);word-break:break-word;}
.rk-body p{margin:0 0 12px;}
.rk-body b{color:#fff;font-weight:800;}
.rk-body code{background:var(--rk-bg3);padding:1px 5px;border-radius:5px;font-size:.86em;font-family:ui-monospace,Menlo,Consolas,monospace;}
.rk-body pre{background:#0b0715;border:1px solid var(--rk-br);border-radius:11px;padding:13px 15px;overflow-x:auto;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;line-height:1.6;margin:0 0 12px;white-space:pre;}
.rk-body .li{position:relative;padding-left:18px;margin:0 0 6px;}
.rk-body .li:before{content:'';position:absolute;left:5px;top:.7em;width:4px;height:4px;border-radius:50%;background:var(--rk-acc2);}
.rk-body .h{font-weight:900;color:#fff;font-size:1.03em;margin:15px 0 7px;}
.rk-body a{color:var(--rk-acc2);text-decoration:none;}
.rk-body a:hover{text-decoration:underline;}

/* ---- file artifacts rocky sends you ---- */
.rk-art{border:1px solid var(--rk-br);border-radius:12px;overflow:hidden;margin:0 0 12px;background:#0b0715;}
.rk-arth{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--rk-bg2);border-bottom:1px solid var(--rk-br);}
.rk-artic{width:26px;height:26px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--rk-acc) 22%,transparent);color:var(--rk-acc2);font-size:.56rem;font-weight:900;letter-spacing:.02em;}
.rk-artn{min-width:0;flex:1;}
.rk-artn b{display:block;font-size:.79rem;font-weight:800;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rk-artn span{display:block;font-size:.66rem;font-weight:600;color:var(--rk-mu2);margin-top:1px;}
.rk-artb{display:flex;gap:3px;flex:none;}
.rk-artb button{width:27px;height:27px;border-radius:7px;border:0;background:transparent;color:var(--rk-mu);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .18s,color .18s,transform .22s var(--e4s);}
.rk-artb button:hover{background:var(--rk-bg4);color:#fff;}
.rk-artb button:active{transform:scale(.9);}
.rk-artb svg{width:14px;height:14px;}
.rk-art pre{margin:0 !important;border:0 !important;border-radius:0 !important;max-height:260px;overflow:auto;background:#0b0715 !important;}
.rk-art.shut pre{max-height:112px;}
.rk-artf{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px;border-top:1px solid var(--rk-br);
  font-size:.7rem;font-weight:700;color:var(--rk-mu2);cursor:pointer;background:var(--rk-bg2);transition:color .18s;}
.rk-artf:hover{color:#fff;}
.rk-dlall{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 13px;border-radius:9px;cursor:pointer;
  border:1px solid color-mix(in srgb,var(--rk-acc) 42%,transparent);background:color-mix(in srgb,var(--rk-acc) 14%,transparent);
  color:var(--rk-acc2);font-size:.75rem;font-weight:800;margin:0 0 12px;
  transition:background .2s,transform .24s var(--e4s);}
.rk-dlall:hover{background:color-mix(in srgb,var(--rk-acc) 24%,transparent);transform:translateY(-1px);}
.rk-dlall svg{width:13px;height:13px;}

/* ---- STEPS : thinking + tool calls ---- */
.rk-steps{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
.rk-step{border:1px solid var(--rk-br);border-radius:12px;background:var(--rk-bg2);overflow:hidden;
  animation:rkStep .45s var(--e4) both;}
@keyframes rkStep{from{opacity:0;transform:translateY(-5px) scale(.995);}to{opacity:1;transform:none;}}
.rk-sh{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;user-select:none;transition:background .18s;}
.rk-sh:hover{background:var(--rk-bg3);}
.rk-sico{width:19px;height:19px;border-radius:6px;background:var(--rk-bg4);display:flex;align-items:center;justify-content:center;flex:none;}
.rk-sico svg{width:11px;height:11px;color:var(--rk-tx);}
.rk-st{font-size:.77rem;font-weight:800;color:var(--rk-tx);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rk-ss{font-size:.68rem;font-weight:700;color:var(--rk-mu2);flex:none;}
.rk-schev{width:13px;height:13px;color:var(--rk-mu2);flex:none;transition:transform .3s var(--e4);}
.rk-step.open .rk-schev{transform:rotate(180deg);}
.rk-sb2{max-height:0;overflow:hidden;transition:max-height .42s var(--e4);}
.rk-step.open .rk-sb2{max-height:1400px;overflow-y:auto;}
.rk-sbi{padding:2px 14px 13px 40px;font-size:.81rem;line-height:1.68;color:var(--rk-mu);white-space:pre-wrap;word-break:break-word;}
.rk-step.live .rk-sico{background:color-mix(in srgb,var(--rk-acc) 32%,transparent);}
.rk-step.live .rk-sico svg{color:var(--rk-acc2);animation:rkSpin 1.4s linear infinite;}
@keyframes rkSpin{to{transform:rotate(360deg);}}
.rk-step.done .rk-sico{background:color-mix(in srgb,var(--rk-acc) 20%,transparent);}
.rk-step.done .rk-sico svg{color:var(--rk-acc2);}
.rk-step.fail .rk-sico{background:#3b1b1b;}
.rk-step.fail .rk-sico svg{color:#f87171;}
.rk-dots{display:inline-flex;gap:3px;align-items:center;}
.rk-dots i{width:3px;height:3px;border-radius:50%;background:currentColor;animation:rkB 1s infinite;}
.rk-dots i:nth-child(2){animation-delay:.15s;}
.rk-dots i:nth-child(3){animation-delay:.3s;}
@keyframes rkB{0%,60%,100%{opacity:.3;transform:translateY(0);}30%{opacity:1;transform:translateY(-3px);}}
.rk-res{display:flex;flex-direction:column;gap:5px;padding:0 14px 12px 40px;}
.rk-rr{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:var(--rk-bg3);
  font-size:.74rem;font-weight:700;color:var(--rk-mu);text-decoration:none;transition:background .18s,color .18s;}
.rk-rr:hover{background:var(--rk-bg4);color:#fff;}
.rk-rr i{width:14px;height:14px;border-radius:4px;background:#ffffff14;flex:none;background-size:cover;background-position:center;}
.rk-rr b{color:var(--rk-acc2);font-weight:800;}
.rk-rr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rk-swarm{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:7px;padding:0 14px 12px 40px;}
.rk-lane{border:1px solid var(--rk-br);border-radius:9px;padding:9px 10px;background:var(--rk-bg3);}
.rk-lane .n{font-size:.69rem;font-weight:900;color:var(--rk-tx);margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.rk-lane .n b{width:5px;height:5px;border-radius:50%;background:var(--rk-mu2);flex:none;}
.rk-lane.live .n b{background:var(--rk-acc2);animation:rkPulse 1s infinite;}
.rk-lane.done .n b{background:var(--rk-acc2);}
@keyframes rkPulse{0%,100%{opacity:1;}50%{opacity:.25;}}
.rk-lane .s{font-size:.66rem;font-weight:600;color:var(--rk-mu2);line-height:1.5;}
.rk-acts{display:flex;gap:2px;margin-top:11px;}
.rk-act{width:27px;height:27px;border-radius:7px;border:0;background:transparent;color:var(--rk-mu2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .18s,color .18s;}
.rk-act:hover{background:var(--rk-bg2);color:#fff;}
.rk-act svg{width:13px;height:13px;}

@media(max-width:720px){
  .rk-sub{display:none;}
  .rk-quick{margin-top:34px;}
}

/* ============================ 2. CHAT (cherri) ============================ */
#view-chat{padding:0 !important;}
.cx{position:absolute;inset:0;display:flex;background:var(--ch-bg);color:var(--ch-text);
  font-family:'Mulish','Inter','Segoe UI',system-ui,sans-serif;overflow:hidden;}
.cx *{box-sizing:border-box;}
.cx button{font-family:inherit;}
/* rail */
.cx-side{width:218px;flex:none;display:flex;flex-direction:column;background:var(--ch-bg1);border-right:1px solid var(--ch-b4);}
.cx-srv{height:48px;flex:none;display:flex;align-items:center;gap:9px;padding:0 14px;border-bottom:1px solid var(--ch-b4);
  font-weight:900;font-size:.9rem;color:var(--ch-bright);}
.cx-srv .d{width:7px;height:7px;border-radius:50%;background:var(--ch-accent);box-shadow:0 0 8px var(--ch-glow);}
.cx-nav{padding:8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;min-height:0;}
.cx-nav::-webkit-scrollbar{width:6px;}
.cx-nav::-webkit-scrollbar-thumb{background:var(--ch-b2);border-radius:9px;}
.cx-cat{display:flex;align-items:center;gap:5px;font-size:.63rem;font-weight:900;letter-spacing:.9px;text-transform:uppercase;
  color:var(--ch-muted);padding:12px 8px 5px;cursor:pointer;user-select:none;}
.cx-cat svg{width:10px;height:10px;transition:transform .28s var(--e4);}
.cx-cat.closed svg{transform:rotate(-90deg);}
.cx-ch{display:flex;align-items:center;gap:7px;height:31px;padding:0 9px;border-radius:8px;cursor:pointer;
  color:var(--ch-muted);font-size:.84rem;font-weight:700;transition:background .18s var(--e4),color .18s;}
.cx-ch:hover{background:var(--ch-bg2);color:var(--ch-text);}
.cx-ch.on{background:var(--ch-bg3);color:var(--ch-bright);}
.cx-ch .h{color:var(--ch-muted);font-weight:900;}
.cx-ch .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cx-ch.unread{color:var(--ch-bright);}
.cx-ch.unread .nm{font-weight:900;}
.cx-pill{font-size:.6rem;font-weight:900;background:var(--ch-accent);color:var(--ch-on);border-radius:99px;min-width:16px;height:16px;
  padding:0 5px;display:flex;align-items:center;justify-content:center;flex:none;}
.cx-ch .lk{width:11px;height:11px;color:var(--ch-muted);flex:none;}
.cx-me{flex:none;display:flex;align-items:center;gap:9px;padding:9px 11px;border-top:1px solid var(--ch-b4);background:var(--ch-bg2);}
.cx-me .tx{min-width:0;flex:1;}
.cx-me .tx b{display:block;font-size:.8rem;font-weight:900;color:var(--ch-bright);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cx-me .tx span{display:block;font-size:.67rem;font-weight:700;color:var(--ch-muted);}

/* middle */
.cx-mid{flex:1;min-width:0;display:flex;flex-direction:column;}
.cx-head{height:48px;flex:none;display:flex;align-items:center;gap:9px;padding:0 16px;border-bottom:1px solid var(--ch-b4);}
.cx-head .h{color:var(--ch-muted);font-weight:900;font-size:1.05rem;}
.cx-head b{font-size:.94rem;font-weight:900;color:var(--ch-bright);}
.cx-topic{font-size:.74rem;font-weight:600;color:var(--ch-muted);padding-left:10px;margin-left:10px;border-left:1px solid var(--ch-b2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40%;}
.cx-hsearch{margin-left:auto;display:flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:9px;
  background:var(--ch-bg2);border:1px solid transparent;transition:border-color .25s,width .25s;}
.cx-hsearch:focus-within{border-color:var(--ch-b2);}
.cx-hsearch svg{width:13px;height:13px;color:var(--ch-muted);}
.cx-hsearch input{background:none;border:0;outline:0;color:var(--ch-text);font-size:.78rem;font-weight:600;width:150px;font-family:inherit;}
.cx-msgs{flex:1;min-height:0;overflow-y:auto;padding:14px 0 6px;}
.cx-msgs::-webkit-scrollbar{width:9px;}
.cx-msgs::-webkit-scrollbar-thumb{background:var(--ch-b2);border-radius:9px;border:2px solid transparent;background-clip:content-box;}
.cx-day{display:flex;align-items:center;gap:12px;margin:14px 18px 10px;font-size:.66rem;font-weight:900;color:var(--ch-muted);
  letter-spacing:.6px;text-transform:uppercase;}
.cx-day:before,.cx-day:after{content:'';flex:1;height:1px;background:var(--ch-b4);}
.cx-m{display:flex;gap:11px;padding:2px 18px;position:relative;animation:cxIn .4s var(--e4) both;}
@keyframes cxIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.cx-m:hover{background:#ffffff05;}
.cx-m.grp{margin-top:9px;}
.cx-m .av{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:.8rem;color:#fff;overflow:hidden;background-size:cover;background-position:center;margin-top:2px;}
.cx-m .sp{width:36px;flex:none;}
.cx-mb{min-width:0;flex:1;padding-bottom:1px;}
.cx-mh{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:1px;}
.cx-mh b{font-size:.87rem;font-weight:900;}
.cx-mh time{font-size:.66rem;font-weight:700;color:var(--ch-muted);}
.cx-tx{font-size:.88rem;line-height:1.52;color:var(--ch-text);word-break:break-word;white-space:pre-wrap;}
.cx-tx a{color:var(--ch-accent);text-decoration:none;}
.cx-tx a:hover{text-decoration:underline;}
.cx-tx code{background:var(--ch-bg3);padding:1px 5px;border-radius:4px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em;}
.cx-tx .men{background:color-mix(in srgb,var(--ch-accent) 22%,transparent);color:var(--ch-bright);border-radius:4px;padding:0 3px;font-weight:800;}
.cx-tx .men.all{background:color-mix(in srgb,var(--ch-accent) 30%,transparent);}
.cx-m.pinged{background:color-mix(in srgb,var(--ch-accent) 9%,transparent);box-shadow:inset 3px 0 0 var(--ch-accent);}
.cx-rep{display:flex;align-items:center;gap:6px;font-size:.7rem;color:var(--ch-muted);margin-bottom:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.cx-rep svg{width:11px;height:11px;flex:none;}
.cx-rep b{font-weight:800;}
.cx-att{max-width:360px;max-height:280px;border-radius:10px;margin-top:5px;display:block;border:1px solid var(--ch-b4);}
.cx-rx{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;}
.cx-rx button{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:7px;border:1px solid var(--ch-b4);
  background:var(--ch-bg2);color:var(--ch-text);font-size:.7rem;font-weight:800;cursor:pointer;transition:transform .2s var(--e4s),background .18s;}
.cx-rx button:hover{transform:translateY(-1px);background:var(--ch-bg3);}
.cx-rx button.mine{border-color:var(--ch-accent);background:color-mix(in srgb,var(--ch-accent) 18%,transparent);}
.cx-tools{position:absolute;right:16px;top:-9px;display:none;gap:1px;background:var(--ch-bg2);border:1px solid var(--ch-b4);
  border-radius:8px;padding:2px;box-shadow:0 5px 18px #0007;}
.cx-m:hover .cx-tools{display:flex;}
.cx-tools button{width:26px;height:26px;border:0;border-radius:6px;background:none;color:var(--ch-muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .16s,color .16s;}
.cx-tools button:hover{background:var(--ch-bg3);color:var(--ch-bright);}
.cx-tools svg{width:14px;height:14px;}
/* bot */
.cx-bot{font-size:.58rem;font-weight:900;letter-spacing:.4px;background:#5865f2;color:#fff;border-radius:4px;padding:1px 5px;}
.cx-sys{margin:4px 18px;padding:9px 13px;border-radius:10px;border:1px solid var(--ch-b3);background:var(--ch-bg1);
  font-size:.78rem;font-weight:700;color:var(--ch-muted);display:flex;align-items:center;gap:9px;animation:cxIn .4s var(--e4) both;}
.cx-sys svg{width:14px;height:14px;color:var(--ch-accent);flex:none;}
/* composer */
.cx-comp{flex:none;padding:0 18px 18px;}
.cx-cbox{display:flex;align-items:flex-end;gap:7px;background:var(--ch-bg2);border:1px solid var(--ch-b4);border-radius:14px;
  padding:7px 8px;transition:border-color .25s var(--e4);}
.cx-cbox:focus-within{border-color:var(--ch-b2);}
.cx-cbox textarea{flex:1;min-width:0;background:none;border:0;outline:0;resize:none;color:var(--ch-text);font-family:inherit;
  font-size:.88rem;line-height:1.5;padding:7px 4px;max-height:140px;min-height:34px;}
.cx-cbox textarea::placeholder{color:var(--ch-muted);}
.cx-cb{width:32px;height:32px;flex:none;border:0;border-radius:9px;background:transparent;color:var(--ch-muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s,transform .24s var(--e4s);}
.cx-cb:hover{background:var(--ch-bg3);color:var(--ch-bright);}
.cx-cb:active{transform:scale(.9);}
.cx-cb svg{width:16px;height:16px;}
.cx-send{background:var(--ch-accent);color:var(--ch-on);}
.cx-send:hover{background:var(--ch-accent);filter:brightness(1.12);}
.cx-locked{margin:0 18px 18px;padding:12px 15px;border-radius:12px;border:1px solid var(--ch-b3);background:var(--ch-bg1);
  font-size:.8rem;font-weight:700;color:var(--ch-muted);display:flex;align-items:center;gap:9px;}
.cx-typing{height:17px;padding:0 20px;font-size:.7rem;font-weight:700;color:var(--ch-muted);}
.cx-rbar{display:flex;align-items:center;gap:8px;margin:0 18px 6px;padding:7px 11px;border-radius:10px;background:var(--ch-bg2);
  border-left:3px solid var(--ch-accent);font-size:.74rem;font-weight:700;color:var(--ch-muted);}
.cx-rbar b{color:var(--ch-bright);}
.cx-rbar button{margin-left:auto;border:0;background:none;color:var(--ch-muted);cursor:pointer;font-size:1rem;line-height:1;}
/* members */
.cx-mem{width:216px;flex:none;background:var(--ch-bg1);border-left:1px solid var(--ch-b4);overflow-y:auto;padding:12px 9px;}
.cx-mem::-webkit-scrollbar{width:6px;}
.cx-mem::-webkit-scrollbar-thumb{background:var(--ch-b2);border-radius:9px;}
.cx-mg{font-size:.63rem;font-weight:900;letter-spacing:.9px;text-transform:uppercase;color:var(--ch-muted);padding:12px 7px 5px;}
.cx-mr{display:flex;align-items:center;gap:9px;padding:5px 7px;border-radius:9px;cursor:pointer;transition:background .18s;}
.cx-mr:hover{background:var(--ch-bg2);}
.cx-mr .av{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:.68rem;color:#fff;position:relative;background-size:cover;background-position:center;}
.cx-mr .av i{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--ch-bg1);background:#9aa1ad;}
.cx-mr.on .av i{background:#23a55a;}
.cx-mr .tx{min-width:0;flex:1;}
.cx-mr .tx b{display:block;font-size:.8rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cx-mr .tx span{display:block;font-size:.66rem;font-weight:600;color:var(--ch-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cx-mr.off{opacity:.42;}

/* role pills */
.rp{display:inline-flex;align-items:center;font-size:.56rem;font-weight:900;letter-spacing:.4px;border-radius:5px;padding:2px 5px;line-height:1.3;}

/* nav badge on the chat tab */
.v2-nav .n-ping{position:absolute;top:5px;right:7px;min-width:15px;height:15px;border-radius:99px;background:#f23f43;color:#fff;
  font-size:.58rem;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 4px;
  box-shadow:0 0 0 2px #0d0716;animation:cxPing .5s var(--e4s);}
@keyframes cxPing{from{transform:scale(0);}to{transform:scale(1);}}

/* ============================ 3. PROFILE + SHOP (cherri) ============================ */
.cp{max-width:1024px;margin:0 auto;width:100%;padding:30px 24px 64px;
  font-family:'Mulish','Inter','Segoe UI',system-ui,sans-serif;color:var(--ch-text);}
.cp *{box-sizing:border-box;}
.cp button{font-family:inherit;}
.cp-h1{font-size:1.55rem;font-weight:900;letter-spacing:-.03em;color:var(--ch-bright);margin:0 0 3px;}
.cp-sub{font-size:.82rem;font-weight:600;color:var(--ch-muted);margin:0 0 22px;}
.cp-card{position:relative;border-radius:18px;border:1px solid var(--ch-b4);background:var(--ch-bg1);overflow:hidden;margin-bottom:16px;}
.cp-banner{height:132px;position:relative;background:linear-gradient(135deg,var(--ch-accent),var(--ch-accent2));
  background-size:cover;background-position:center;}
.cp-bedit{position:absolute;right:10px;top:10px;height:28px;padding:0 11px;border-radius:9px;border:1px solid #ffffff2b;
  background:#00000066;backdrop-filter:blur(8px);color:#fff;font-size:.72rem;font-weight:800;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:background .2s,transform .24s var(--e4s);}
.cp-bedit:hover{background:#000000a6;transform:translateY(-1px);}
.cp-bedit svg{width:12px;height:12px;}
.cp-idrow{display:flex;align-items:flex-start;gap:16px;padding:0 20px 18px;margin-top:-44px;position:relative;}
.cp-av{width:92px;height:92px;border-radius:50%;flex:none;border:5px solid var(--ch-bg1);background:var(--ch-bg3);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:2rem;color:#fff;overflow:hidden;
  background-size:cover;background-position:center;position:relative;}
.cp-avedit{position:absolute;inset:0;border-radius:50%;background:#000000ad;color:#fff;display:flex;align-items:center;
  justify-content:center;opacity:0;cursor:pointer;transition:opacity .22s var(--e4);font-size:.66rem;font-weight:800;text-align:center;}
.cp-av:hover .cp-avedit{opacity:1;}
.cp-idtx{min-width:0;flex:1;padding-top:52px;}
.cp-dn{font-size:1.35rem;font-weight:900;letter-spacing:-.02em;line-height:1.15;word-break:break-word;}
.cp-un{font-size:.82rem;font-weight:700;color:var(--ch-muted);margin-top:1px;}
.cp-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;}
.cp-bdg{display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 8px;border-radius:7px;background:var(--ch-bg3);
  border:1px solid var(--ch-b4);font-size:.65rem;font-weight:900;letter-spacing:.3px;
  transition:transform .24s var(--e4s);}
.cp-bdg:hover{transform:translateY(-2px);}
.cp-idacts{display:flex;gap:7px;padding-top:54px;flex:none;}
.cp-btn{height:32px;padding:0 13px;border-radius:11px;border:1px solid var(--ch-b4);background:var(--ch-bg2);
  color:var(--ch-bright);font-size:.76rem;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:background .2s,border-color .2s,transform .24s var(--e4s);}
.cp-btn:hover{background:var(--ch-bg3);border-color:var(--ch-b2);transform:translateY(-1px);}
.cp-btn:active{transform:scale(.97);}
.cp-btn svg{width:13px;height:13px;}
.cp-btn.acc{background:var(--ch-accent);border-color:transparent;color:var(--ch-on);}
.cp-btn.acc:hover{filter:brightness(1.1);background:var(--ch-accent);}
.cp-btn.dang{background:#f43f5e26;border-color:#f43f5e33;color:#fb7185;}
.cp-btn.dang:hover{background:#f43f5e3d;}
.cp-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start;}
@media(max-width:860px){.cp-grid{grid-template-columns:1fr;}}
.cp-panel{border-radius:16px;border:1px solid var(--ch-b4);background:var(--ch-bg1);padding:17px 18px;margin-bottom:16px;}
.cp-pt{font-size:.68rem;font-weight:900;letter-spacing:.9px;text-transform:uppercase;color:var(--ch-muted);margin:0 0 11px;
  display:flex;align-items:center;gap:7px;}
.cp-pt svg{width:13px;height:13px;}
.cp-bio{font-size:.86rem;line-height:1.68;color:var(--ch-text);white-space:pre-wrap;word-break:break-word;}
.cp-bio.empty{color:var(--ch-muted);font-style:italic;}
.cp-kv{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.78rem;font-weight:700;color:var(--ch-muted);}
.cp-kv div b{display:block;font-size:.63rem;font-weight:900;letter-spacing:.7px;text-transform:uppercase;color:var(--ch-muted);opacity:.75;margin-bottom:2px;}
.cp-kv div span{color:var(--ch-bright);font-weight:800;}
.cp-stand{display:flex;align-items:center;gap:11px;padding:13px 15px;border-radius:13px;border:1px solid #22c55e33;background:#22c55e14;}
.cp-stand.bad{border-color:#f43f5e33;background:#f43f5e14;}
.cp-stand .ic{width:34px;height:34px;border-radius:10px;background:#22c55e26;display:flex;align-items:center;justify-content:center;flex:none;}
.cp-stand.bad .ic{background:#f43f5e26;}
.cp-stand .ic svg{width:17px;height:17px;color:#4ade80;}
.cp-stand.bad .ic svg{color:#fb7185;}
.cp-stand .tx b{display:block;font-size:.85rem;font-weight:900;color:var(--ch-bright);}
.cp-stand .tx span{display:block;font-size:.74rem;font-weight:600;color:var(--ch-muted);margin-top:1px;}
.cp-links{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.cp-link{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:var(--ch-bg2);
  border:1px solid var(--ch-b4);cursor:pointer;text-align:left;color:var(--ch-text);font-size:.8rem;font-weight:800;
  transition:background .2s,border-color .2s,transform .24s var(--e4s);}
.cp-link:hover{background:var(--ch-bg3);border-color:var(--ch-b2);transform:translateY(-2px);}
.cp-link svg{width:15px;height:15px;color:var(--ch-muted);flex:none;}
.cp-played{display:flex;flex-direction:column;gap:7px;}
.cp-pl{display:flex;align-items:center;gap:11px;padding:8px;border-radius:11px;background:var(--ch-bg2);border:1px solid var(--ch-b4);}
.cp-pl .th{width:52px;height:38px;border-radius:8px;background:var(--ch-bg3);flex:none;display:flex;align-items:center;
  justify-content:center;font-size:1rem;overflow:hidden;}
.cp-pl .th img{width:100%;height:100%;object-fit:cover;}
.cp-pl .tx{min-width:0;flex:1;}
.cp-pl .tx b{display:block;font-size:.79rem;font-weight:800;color:var(--ch-bright);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cp-pl .tx span{display:block;font-size:.68rem;font-weight:600;color:var(--ch-muted);}
.cp-empty{border-radius:13px;border:1px dashed var(--ch-b2);background:#ffffff05;padding:26px 16px;text-align:center;
  font-size:.79rem;font-weight:700;color:var(--ch-muted);}
/* profile edit field rows */
.cp-field{margin-bottom:13px;}
.cp-lab{font-size:.68rem;font-weight:900;letter-spacing:.7px;text-transform:uppercase;color:var(--ch-muted);margin-bottom:6px;display:block;}
.cp-in{width:100%;height:36px;padding:0 12px;border-radius:11px;background:var(--ch-bg);border:1px solid var(--ch-b4);
  color:var(--ch-bright);font-size:.82rem;font-weight:700;outline:0;font-family:inherit;transition:border-color .22s;}
.cp-in:focus{border-color:var(--ch-b2);}
textarea.cp-in{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.6;}
.cp-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cp-swatches{display:flex;flex-wrap:wrap;gap:7px;}
.cp-sw{width:28px;height:28px;border-radius:9px;cursor:pointer;border:2px solid transparent;transition:transform .24s var(--e4s);}
.cp-sw:hover{transform:scale(1.12);}
.cp-sw.on{border-color:var(--ch-bright);}
.cp-seg{display:inline-flex;gap:3px;padding:3px;border-radius:11px;background:var(--ch-bg2);border:1px solid var(--ch-b4);}
.cp-seg button{height:26px;padding:0 12px;border-radius:8px;border:0;background:transparent;color:var(--ch-muted);
  font-size:.74rem;font-weight:800;cursor:pointer;transition:background .2s,color .2s;}
.cp-seg button.on{background:var(--ch-bg4);color:var(--ch-bright);}
.cp-prev{border-radius:14px;border:1px solid var(--ch-b4);overflow:hidden;background:var(--ch-bg2);}
.cp-prevb{height:66px;background:linear-gradient(135deg,var(--ch-accent),var(--ch-accent2));background-size:cover;background-position:center;}
.cp-prevr{display:flex;align-items:flex-end;gap:11px;padding:0 14px 14px;margin-top:-24px;}
.cp-prevav{width:54px;height:54px;border-radius:50%;border:4px solid var(--ch-bg2);background:var(--ch-bg3);flex:none;
  display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;background-size:cover;background-position:center;}

/* ---- SHOP ---- */
.cs{max-width:1024px;margin:0 auto;width:100%;padding:30px 24px 64px;font-family:'Mulish','Inter','Segoe UI',system-ui,sans-serif;}
.cs-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;}
.cs-bal{display:flex;align-items:center;gap:9px;border-radius:13px;border:1px solid var(--ch-b4);background:var(--ch-bg1);padding:9px 15px;}
.cs-bal svg{width:16px;height:16px;color:var(--ch-accent);}
.cs-bal b{font-size:1rem;font-weight:900;color:var(--ch-bright);}
.cs-bal span{font-size:.72rem;font-weight:700;color:var(--ch-muted);}
.cs-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.cs-tab{height:32px;padding:0 14px;border-radius:11px;border:1px solid var(--ch-b4);background:var(--ch-bg1);
  color:var(--ch-muted);font-size:.77rem;font-weight:800;cursor:pointer;
  transition:background .2s,color .2s,border-color .2s,transform .24s var(--e4s);}
.cs-tab:hover{color:var(--ch-bright);background:var(--ch-bg2);transform:translateY(-2px);}
.cs-tab.on{background:var(--ch-accent);border-color:transparent;color:var(--ch-on);}
.cs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:10px;}
.cs-item{display:flex;flex-direction:column;border-radius:13px;border:1px solid var(--ch-b4);background:var(--ch-bg1);padding:12px;
  transition:border-color .25s,transform .3s var(--e4),background .25s;animation:cxIn .4s var(--e4) both;}
.cs-item:hover{border-color:var(--ch-b2);transform:translateY(-3px);background:var(--ch-bg2);}
.cs-prev{height:96px;margin-bottom:12px;border-radius:10px;background:var(--ch-bg2);display:flex;align-items:center;
  justify-content:center;overflow:hidden;position:relative;}
.cs-prev .emo{font-size:2.3rem;filter:drop-shadow(0 4px 12px #0008);}
.cs-nt{position:relative;height:80px;width:144px;border-radius:9px;border:1px solid var(--ch-b4);background:var(--ch-bg3);overflow:hidden;}
.cs-nt .strip{position:absolute;left:0;right:0;top:0;height:28px;background:var(--ch-bg2);}
.cs-nt .av{position:absolute;left:8px;top:12px;width:32px;height:32px;border-radius:50%;border:2px solid var(--ch-bg3);
  display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:900;color:#fff;background:var(--ch-accent2);}
.cs-nt .nm{position:absolute;left:8px;top:48px;max-width:7.5rem;font-size:.63rem;font-weight:900;color:var(--ch-bright);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cs-nt .tg{position:absolute;left:8px;top:62px;font-size:.55rem;font-weight:900;padding:1px 5px;border-radius:4px;}
.cs-ih{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px;}
.cs-in{font-size:.84rem;font-weight:900;color:var(--ch-bright);line-height:1.25;}
.cs-ip{display:flex;align-items:center;gap:4px;font-size:.78rem;font-weight:900;color:var(--ch-text);flex:none;}
.cs-ip svg{width:12px;height:12px;color:var(--ch-accent);}
.cs-id{font-size:.72rem;font-weight:600;color:var(--ch-muted);line-height:1.5;margin-bottom:11px;}
.cs-ia{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:7px;}
.cs-sb{height:30px;padding:0 12px;border-radius:9px;border:0;font-size:.74rem;font-weight:900;cursor:pointer;
  transition:filter .2s,transform .24s var(--e4s),background .2s;}
.cs-sb:active{transform:scale(.95);}
.cs-sb.buy{background:var(--ch-accent);color:var(--ch-on);}
.cs-sb.buy:hover{filter:brightness(1.1);}
.cs-sb.buy:disabled{opacity:.42;cursor:default;}
.cs-sb.eq{background:var(--ch-bg3);color:var(--ch-bright);}
.cs-sb.eq:hover{filter:brightness(1.3);}
.cs-sb.gh{background:transparent;border:1px solid var(--ch-b4);color:var(--ch-muted);}
.cs-sb.gh:hover{color:var(--ch-bright);background:var(--ch-bg2);}
.cs-owned{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:8px;
  background:#22c55e1a;border:1px solid #22c55e33;color:#4ade80;font-size:.66rem;font-weight:900;letter-spacing:.4px;}

/* ============================ 4. MEMBERS ============================ */
.cm{max-width:1024px;margin:0 auto;width:100%;padding:30px 24px 64px;font-family:'Mulish','Inter','Segoe UI',system-ui,sans-serif;}
.cm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:11px;}
.cm-card{border-radius:15px;border:1px solid var(--ch-b4);background:var(--ch-bg1);overflow:hidden;
  transition:border-color .25s,transform .3s var(--e4);animation:cxIn .4s var(--e4) both;}
.cm-card:hover{border-color:var(--ch-b2);transform:translateY(-3px);}
.cm-ban{height:48px;background:linear-gradient(135deg,var(--ch-accent),var(--ch-accent2));background-size:cover;background-position:center;}
.cm-body{padding:0 14px 14px;margin-top:-22px;}
.cm-av{width:48px;height:48px;border-radius:50%;border:4px solid var(--ch-bg1);background:var(--ch-bg3);display:flex;
  align-items:center;justify-content:center;font-weight:900;font-size:1rem;color:#fff;position:relative;
  background-size:cover;background-position:center;}
.cm-av i{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;border:3px solid var(--ch-bg1);background:#6b7280;}
.cm-card.on .cm-av i{background:#23a55a;box-shadow:0 0 7px #23a55a99;}
.cm-nm{font-size:.92rem;font-weight:900;color:var(--ch-bright);margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cm-un{font-size:.73rem;font-weight:700;color:var(--ch-muted);}
.cm-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;min-height:20px;}
.cm-st{display:flex;align-items:center;gap:6px;font-size:.7rem;font-weight:700;color:var(--ch-muted);margin-top:9px;}
.cm-st b{width:6px;height:6px;border-radius:50%;background:#6b7280;flex:none;}
.cm-card.on .cm-st b{background:#23a55a;}
.cm-acts{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap;}
.cm-ab{height:28px;padding:0 10px;border-radius:9px;border:1px solid var(--ch-b4);background:var(--ch-bg2);color:var(--ch-muted);
  font-size:.7rem;font-weight:800;cursor:pointer;transition:background .2s,color .2s,transform .22s var(--e4s);}
.cm-ab:hover{color:var(--ch-bright);background:var(--ch-bg3);transform:translateY(-1px);}
.cm-ab.red{background:#f43f5e1f;border-color:#f43f5e2e;color:#fb7185;}
.cm-ab.red:hover{background:#f43f5e33;}
.cm-ab.grn{background:#22c55e1f;border-color:#22c55e2e;color:#4ade80;}

/* ============================ 5. BAN SCREEN (error 88) ============================ */
#v39-ban{background:#000 !important;}
#v39-ban.on{animation:v40flash .62s steps(1,end) infinite !important;}
@keyframes v40flash{0%{background:#000;}50%{background:#fff;}100%{background:#000;}}
#v39-ban .bt{color:#ff1f1f !important;font-size:clamp(1.3rem,4.4vw,2.9rem) !important;font-weight:900;
  text-shadow:0 0 18px #ff000070;max-width:1000px;line-height:1.22;}
#v39-ban .b88{color:#ff1f1f;font-size:clamp(1.1rem,3.2vw,2rem);font-weight:900;margin-top:14px;letter-spacing:.06em;}
#v39-ban .bs{color:#ff1f1f !important;opacity:.85;font-weight:800;}
#v39-ban .bq{color:#ff1f1f !important;}
#v39-ban .bbtn{color:#ff1f1f !important;border-color:#ff1f1f !important;}

/* ============================ 6. SETTINGS (smooth cherri open/close) ============================ */
.set-ovl{display:flex !important;opacity:0;pointer-events:none;
  transition:opacity .34s var(--e4),backdrop-filter .34s var(--e4) !important;}
.set-ovl.on{opacity:1;pointer-events:auto;}
.set-dlg{animation:none !important;transform:scale(.94) translateY(14px);opacity:0;
  transition:transform .42s var(--e4),opacity .3s var(--e4) !important;}
.set-ovl.on .set-dlg{transform:none;opacity:1;}
.set-ovl.closing{opacity:0;}
.set-ovl.closing .set-dlg{transform:scale(.96) translateY(8px);opacity:0;}
#set-nav2 button{transition:background .2s var(--e4),color .2s,transform .22s var(--e4s) !important;}
#set-nav2 button:active{transform:scale(.97);}
.set-body2{scroll-behavior:smooth;}
.set-row2{animation:cxIn .34s var(--e4) both;}

/* ============================ 7. LANDING (buttery loop) ============================ */
#home-quote{min-height:24px;transition:none;}
#home-quote .hq{display:inline-block;animation:hqIn .9s var(--e4) both;}
@keyframes hqIn{from{opacity:0;transform:translateY(7px);filter:blur(3px);}to{opacity:1;transform:none;filter:blur(0);}}
#view-landing{transition:--gx 18s linear,--gy 18s linear;}

  box-shadow:inset 0 1px 0 #ffffff26,0 5px 16px #00000059;}
.ap-logo svg{width:22px;height:22px;}

function md(t) {

  var blocks = [];
  var langs = [];

       .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')

       .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
       .replace(/^#{1,4}\s+(.+)$/gm, '<div class="h">$1</div>')
       .replace(/^\s*(?:[-*]|\d+\.)\s+(.+)$/gm, '<div class="li">$1</div>');

  attach: function (fl) {

      if (f.size > 12 * 1024 * 1024) { toast(f.name + ' is too big (12MB max).'); return; }
      var kind = /^image\//.test(f.type) ? 'img' : /^(text\/|application\/(json|javascript|xml))/.test(f.type) ? 'txt' : 'bin';
      var item = { id: 'f' + now() + Math.random().toString(36).slice(2, 5), name: f.name, kind: kind, data: null, text: null };
      self.files.push(item);
      var r = new FileReader();
      r.onload = function () { if (kind === 'img') item.data = String(r.result); else item.text = String(r.result).slice(0, 24000); self.paintFiles(); };
      if (kind === 'img') r.readAsDataURL(f); else r.readAsText(f);
      self.paintFiles();
    });

    if (this.busy) { toast('E-GPT is still working — press stop first.'); return; }

    var fl = this.files.slice();
    c.msgs.push({ role: 'user', txt: q || '(files)', files: fl.map(function (f) { return { name: f.name, kind: f.kind, text: f.text, data: f.data }; }) });

  async run(q, c) {
    var self = this;
    var feed = $('rk-feed');
    var m = model(), eff = effort();
    if (m.kind === 'image') return this.runImage(q, c, m, eff);
    if (m.kind === 'video') return this.runVideo(q, c, m, eff);
    if (isSlides(q)) return this.runSlides(q, c, m, eff);
    var wrap = document.createElement('div');
    wrap.className = 'rk-m rk-ai';
    wrap.innerHTML = '<div class="rk-head"><span class="rk-av eg-logo live">' + EG_LOGO + '</span><span class="rk-who">E-GPT</span>' +
      '<span class="rk-badge">' + esc(m.name) + ' · ' + EFFORT_LABEL[eff] + '</span></div>';
    feed.appendChild(wrap);
    var steps = new Steps(wrap);
    var body = document.createElement('div');
    body.className = 'rk-body';
    wrap.appendChild(body);
    this.scroll();
    this.setBusy(true);
    var ctrl = new AbortController(); this.abort = ctrl;
    var record = [];
    var t0 = now();

    try {
      /* ---------- step 1 : plan ---------- */
      var plan = steps.add({ title: 'Understanding the request', icon: ICO.brain, open: false });
      plan.sub('<span class="rk-dots"><i></i><i></i><i></i></span>');
      await sleep(m.fast ? 120 : 340);
      plan.text('Intent: ' + (q.length > 160 ? q.slice(0, 160) + '…' : q) +
        '\nModel: ' + m.name + '\nThinking effort: ' + EFFORT_LABEL[eff] +
        (store().web ? '\nTools: web search enabled' : '\nTools: none required'));
      plan.done();
      record.push({ t: 'Understanding the request', s: '', b: plan.body.textContent });
      this.scroll();

      /* ---------- step 2 : web search / swarm ---------- */
      var webCtx = '', sources = [];
      if (store().web || m.swarm || m.agent) {
        if (m.swarm) {
          var sw = steps.add({ title: 'Swarm — dispatching parallel agents', icon: ICO.swarm, open: true });
          var queries = swarmQueries(q);
          sw.html('<div style="margin-bottom:8px;">Dispatched 75 agents across ' + queries.length + ' search lanes.</div>');
          sw.extra('<div class="rk-swarm" id="rk-lanes">' + queries.map(function (x, i) {
            return '<div class="rk-lane live" data-l="' + i + '"><div class="n"><b></b>Agents ' + (Math.floor(i * 75 / queries.length) + 1) + '–' + Math.floor((i + 1) * 75 / queries.length) + '</div><div class="s">' + esc(x) + '</div></div>';
          }).join('') + '</div>');
          this.scroll();
          var res = await Promise.all(queries.map(function (x, i) {
            return websearch(x).then(function (r) {
              var lane = wrap.querySelector('[data-l="' + i + '"]');
              if (lane) { lane.classList.remove('live'); lane.classList.add('done'); lane.querySelector('.s').textContent = r.length + ' sources'; }
              return r;
            }).catch(function () { return []; });
          }));
          res.forEach(function (r) { sources = sources.concat(r); });
          sources = dedupe(sources).slice(0, 12);
          sw.done(sources.length + ' sources');
          record.push({ t: 'Swarm — ' + queries.length + ' parallel agents', s: sources.length + ' sources', b: queries.join('\n') });
        } else {
          var ws = steps.add({ title: 'Searching the web', icon: ICO.globe, open: true });
          ws.text('query: ' + q.slice(0, 140));
          this.scroll();
          sources = await websearch(q).catch(function () { return []; });
          ws.done(sources.length + ' results');
        }
        if (sources.length) {
          var rd = steps.add({ title: 'Reading ' + sources.length + ' sources', icon: ICO.file, open: true });
          rd.html('');
          rd.extra('<div class="rk-res">' + sources.map(function (s, i) {
            var host = 'web'; try { host = new URL(s.u).hostname.replace(/^www\./, ''); } catch (e) {}
            return '<a class="rk-rr" href="' + esc(s.u) + '" target="_blank" rel="noopener">' +
              '<i style="background-image:url(https://www.google.com/s2/favicons?sz=32&domain=' + esc(host) + ')"></i>' +
              '<b>' + (i + 1) + '</b><span>' + esc(s.t) + '</span></a>';
          }).join('') + '</div>');
          await sleep(m.fast ? 150 : 420);
          rd.done();
          record.push({ t: 'Reading ' + sources.length + ' sources', s: '', h: '<div class="rk-res">' + sources.map(function (s, i) {
            var host = 'web'; try { host = new URL(s.u).hostname.replace(/^www\./, ''); } catch (e) {}
            return '<a class="rk-rr" href="' + esc(s.u) + '" target="_blank" rel="noopener"><i style="background-image:url(https://www.google.com/s2/favicons?sz=32&domain=' + esc(host) + ')"></i><b>' + (i + 1) + '</b><span>' + esc(s.t) + '</span></a>';
